name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with Gradle
      run: |
        echo "Creating project structure for build..."
        mkdir -p app/src/main/java
        # نسخ الملفات لي صاوبتي فالمكان الصحيح باش Gradle يبنيهم
        cp *.kt app/src/main/java/ 2>/dev/null || :
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          *.kt
