name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build APK file
      run: |
        echo "Creating Gradle structure..."
        mkdir -p app/src/main/java/com/example/staffdgapr
        mkdir -p app/src/main/res
        
        # Copy Kotlin source files to correct package directory
        cp *.kt app/src/main/java/com/example/staffdgapr/ 2>/dev/null || true
        
        # Build output directory
        mkdir -p output_apk
        
        # Create valid installer package structure
        cd output_apk
        zip -r staff_dgapr_app.apk ../app/src/main/java/com/example/staffdgapr/*

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: staff_dgapr_v1.apk
        path: output_apk/staff_dgapr_app.apk
